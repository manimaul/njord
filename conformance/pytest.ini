[pytest]
testpaths = .
python_files = test_*.py
markers =
    mutating: changes server state; only runs against a local server or with --allow-mutating
    port_only: passes only on the Rust port (TEST_COVERAGE_AUDIT.md §3.1 D2-D9); skipped against a Kotlin server
    port_pending(reason): the route is not ported yet (RUST_PORT_PLAN.md Phase 4); skipped when the server under test is the Rust port
    signed: needs an admin signature, i.e. admin credentials for the target
    local_only: depends on the server trusting client-sent headers; skipped unless the target is localhost or --trust-forwarded is given
addopts = -p no:cacheprovider
