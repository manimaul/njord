[package]
name = "njord-enc-cron"
description = "Nightly NOAA ENC updater: diffs NOAA's product catalog against Njord and bundles the stale cells into save/"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "njord-enc-cron"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
indexmap.workspace = true
jiff.workspace = true
njord-model.workspace = true
quick-xml = { version = "0.42.0", features = ["async-tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54", features = ["macros", "rt", "fs", "io-util", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
njord-testdata.workspace = true
