    <script>
        // The stored theme (storage.rs "Theme": ["…ThemeMode", "DUSK"] or ["…CustomTheme", {mode}])
        // colours the page before the first paint; the app sets data-theme again once it runs.
        try {
            var theme = JSON.parse(localStorage.getItem("Theme"))[1];
            var mode = typeof theme === "string" ? theme : theme.mode;
            if (mode === "DUSK" || mode === "NIGHT") document.documentElement.dataset.theme = mode.toLowerCase();
        } catch (e) {}
    </script>
    <link data-trunk rel="css" href="vendor/maplibre-gl.css">

    <script type="module">
        // MapLibre GL is ES modules only and defines no global; the app's bindings (maplibre.rs)
        // use `maplibregl`. This runs before the app's own module script, which follows it.
        // The file names carry their content hash (vendor/README.md), so the worker is named here.
        import * as maplibregl from "/maplibre-gl-01590c9875ea5bb0.mjs";
        maplibregl.setWorkerUrl("/maplibre-gl-worker-c8564c4a4147326a.mjs");
        globalThis.maplibregl = maplibregl;
    </script>
