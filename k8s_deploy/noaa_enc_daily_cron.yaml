---
# Nightly NOAA ENC update.
#
# Parses https://charts.noaa.gov/ENCs/ENCProdCat_19115.xml, asks the chart service which chart
# revisions it already holds via GET /v1/chart_editions, and downloads only the cells that
# actually changed - bundling them into zips that ChartIngestWorker picks up from
# /mnt/njord/charts/save.
#
# This replaces an unconditional `curl OneDay_ENCs.zip`, which re-ingested every cell in the
# bundle nightly and permanently lost anything published while the cluster was down.
#
# Needs no database access: the revision baseline comes from the HTTP endpoint, so there is no
# pgbouncer sidecar here.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: njord-enc-download
  namespace: njord
spec:
  schedule: "0 0 * * *"
  timeZone: "America/Los_Angeles"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghreg
          containers:
            - name: enc-download
              image: ghcr.io/manimaul/njord-chart-server:1.3
              imagePullPolicy: Always
              securityContext:
                runAsUser: 0
              command:
                - /opt/njord/enc_cron.kexe
                - /opt/njord/enc_cron_resources
              # Tunables live in the njord-enc-cron-config ConfigMap below, which replaces the
              # copy baked into the image. ENC_CRON_OPTS still overlays it if you need a one-off
              # override on a manually created Job.
              env:
                # Authorizes DELETE /v1/chart for cells NOAA has withdrawn. Without both, the job
                # still reports orphans but deletes nothing. Set deleteOrphans:false in the
                # ConfigMap to switch the behaviour off entirely while leaving credentials in place.
                # kubectl -n njord create secret generic njord-admin-basic \
                #   --from-literal=admin_user="${NJORD_ADMIN_USER}" --from-literal=admin_pass="${NJORD_ADMIN_PASS}"
                - name: ENC_CRON_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: njord-admin-basic
                      key: admin_user
                      optional: true
                - name: ENC_CRON_ADMIN_PASS
                  valueFrom:
                    secretKeyRef:
                      name: njord-admin-basic
                      key: admin_pass
                      optional: true
              resources:
                limits:
                  cpu: "1.0"
                  memory: "1G"
                requests:
                  cpu: 250m
                  memory: "256Mi"
              volumeMounts:
                # subPath so only this file is replaced, leaving the rest of enc_cron_resources
                # as the image shipped it.
                - name: njord-enc-cron-config-vol
                  mountPath: /opt/njord/enc_cron_resources/config/enc_cron.json
                  subPath: enc_cron.json
                  readOnly: true
                - name: njord-shared-data
                  mountPath: /mnt/njord
          volumes:
            - name: njord-enc-cron-config-vol
              configMap:
                name: njord-enc-cron-config
            - name: njord-shared-data
              persistentVolumeClaim:
                claimName: njord-shared-data
---
# The whole of enc_cron.json, not a patch: the mount replaces the file baked into the image, so
# anything omitted here falls back to the data class default rather than to the image's copy.
#
# Raise maxCellsPerRun temporarily to seed a cold catalog faster (~7.2k cells).
#
# Edits apply to the next scheduled run - a CronJob builds a fresh pod each time, so there is no
# rollout to trigger.
apiVersion: v1
kind: ConfigMap
metadata:
  name: njord-enc-cron-config
  namespace: njord
data:
  enc_cron.json: |
    {
      "catalogUrl": "https://charts.noaa.gov/ENCs/ENCProdCat_19115.xml",
      "chartEditionsUrl": "http://njord-chart-svc/v1/chart_editions",
      "chartTempData": "/mnt/njord/charts",
      "maxCellsPerRun": 500,
      "bundleSizeCells": 50,
      "maxBundleUncompressedBytes": 268435456,
      "maxQueuedBundles": 3,
      "scaleFilter": [],
      "requestTimeoutSeconds": 600,
      "maxRetries": 3,
      "deleteOrphans": true,
      "maxOrphanDeletes": 25
    }
