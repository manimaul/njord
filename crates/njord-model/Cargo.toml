[package]
name = "njord-model"
description = "Njord wire types: the HTTP/WebSocket API contract shared by the server and the web UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Must keep compiling for wasm32-unknown-unknown: njord-web depends on this crate and nothing else
# from the backend.
[dependencies]
geojson.workspace = true
indexmap.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
# `openapi` only: schemas for the server's OpenAPI document. Never enabled by njord-web.
utoipa = { version = "6", optional = true, features = ["indexmap", "jiff_0_2"] }

[dev-dependencies]
base64 = "0.22"
njord-testdata.workspace = true

[features]
# `utoipa::ToSchema` on every wire type (see the crate docs).
openapi = ["dep:utoipa"]
