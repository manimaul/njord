# Local development: the PostGIS the server, njord-db's and njord-server's tests connect to.
# On the first start (an empty ./pb) the image creates the njord_rust database with PostGIS
# loaded; delete ./pb to start over.
version: '3.8'
services:

  postgres:
    image: 'docker.io/postgis/postgis:13-3.1'
    hostname: postgres
    networks:
      - overlay
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d njord_rust"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./pb:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: njord_rust


networks:
  overlay:
