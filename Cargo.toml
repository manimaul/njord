# Njord workspace (docs/RUST_PORT_PLAN.md §3.1).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/manimaul/njord"

[workspace.dependencies]
njord-model = { path = "crates/njord-model" }
njord-testdata = { path = "crates/njord-testdata" }
njord-geo = { path = "crates/njord-geo" }
njord-s57 = { path = "crates/njord-s57" }
njord-symbology = { path = "crates/njord-symbology" }
njord-db = { path = "crates/njord-db" }
geojson = { version = "1", default-features = false }
indexmap = { version = "2", features = ["serde"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: Kotlin serialises maps and JSON objects in insertion order (LinkedHashMap), so
# every JSON object the port reads keeps its key order when written back out.
# float_roundtrip: parse every double exactly; without it some fixture doubles come back 1 ulp off
# (e.g. 7.4012664874018315), which breaks exact comparison against Kotlin output.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
